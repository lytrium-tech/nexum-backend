services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexum_backend_api
    env_file:
      - .env
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8010:8000"
    restart: always
    networks:
      - nexum_backend_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nexum_backend_network:
    driver: bridge
